
name: Capricorn Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          exit "$BUILD_STATUS"

      - name: Show compilation errors
        if: always()
        run: |
          echo "## Capricorn Build Errors" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -n -E '(^e: |What went wrong:|Compilation error|Unresolved reference|Caused by:)' build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capricorn-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: capricorn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
